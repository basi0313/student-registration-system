spring.application.name=notification-service
server.port=${SERVER_PORT:8083}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=org.basith.notificationservice.RegistrationEvent
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4317
management.opentelemetry.tracing.export.otlp.transport=grpc
management.tracing.sampling.probability=1.0
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
spring.kafka.consumer.observation-enabled=true
spring.kafka.producer.observation-enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'student-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['student-service:8081']

  - job_name: 'registration-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['registration-service:8082']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8083']
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']